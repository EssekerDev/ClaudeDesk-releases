name: publish firmware

on:
  push:
    paths:
      - .github/workflows/publish-fw.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Publish firmware 0.2.9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            https://contacts-least-gather-lone.trycloudflare.com/firmware.bin \
            -o firmware.bin
          echo "55a88107c895b7314727f03569bb7abfa16a0588c628edbad6a4bfdf6a1836be  firmware.bin" | sha256sum -c -
          test "$(wc -c < firmware.bin)" -eq 2430448
          python3 - << 'PY'
          import json
          manifest = {
              "version": "0.2.9",
              "sha256": "55a88107c895b7314727f03569bb7abfa16a0588c628edbad6a4bfdf6a1836be",
              "url": "https://github.com/EssekerDev/ClaudeDesk-releases/releases/download/fw-v0.2.9/firmware.bin",
              "board": "waveshare-esp32c6-amoled-216",
              "min_app": "0.1.0",
          }
          for path in ("manifest.json", "firmware/latest.json"):
              with open(path, "w") as f:
                  json.dump(manifest, f, indent=2)
                  f.write("\n")
          PY
          if gh release view fw-v0.2.9 >/dev/null 2>&1; then
            gh release upload fw-v0.2.9 firmware.bin manifest.json --clobber
          else
            gh release create fw-v0.2.9 firmware.bin manifest.json \
              --target main \
              --title "Firmware 0.2.9" \
              --notes "ClaudeDesk firmware 0.2.9 for the Waveshare ESP32-C6-Touch-AMOLED-2.16. firmware.bin is a merged image, flash at 0x0. A mixed WPA2/WPA3 join writes a fresh SAE config instead of the 0xFF password identifier. sha256 in manifest.json." \
              --latest=true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/latest.json
          git diff --cached --quiet || git commit -m "firmware 0.2.9"
          git push
